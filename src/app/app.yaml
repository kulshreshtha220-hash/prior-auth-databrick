command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

env:
  - name: PA_CATALOG
    value: "db_certification"
  - name: PA_SCHEMA
    value: "prior_auth"
  - name: PA_AGENT_MODE
    value: "inprocess"
  - name: PA_STATE_STORE
    value: "memory"
  - name: PA_WRITE_DELTA
    value: "false"
  - name: PA_LLM_MODEL
    value: "databricks-claude-sonnet-4-5"   # notebook 07 cell 1 wala naam
  - name: PA_MCP_MODE
    value: "direct"
  - name: PA_USE_PROMPT_REGISTRY
    value: "false"
  - name: PA_REFERENCE_FALLBACK
    value: "false"
  - name: PA_AGENT_TIMEOUT_S
    value: "300"
