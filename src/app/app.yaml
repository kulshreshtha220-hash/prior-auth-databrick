# Databricks App runtime config (pa-review).
#
# CURRENT: agents run inside the app, cases/decisions/audit saved in Lakebase
# (resource key "database" -> project pa-lakebase), data from the live MCP servers.
# Delta writes stay off until a SQL warehouse exists.
#
# When the SQL warehouse + Lakebase exist (see docs/RUNBOOK.md):
#   PA_STATE_STORE=lakebase, PA_WRITE_DELTA=true, add the sql-warehouse resource and
#   DATABRICKS_WAREHOUSE_ID (valueFrom: sql-warehouse), and to read ICD-10 / NPI / CMS
#   from Unity Catalog instead of MCP set:
#   PA_DATA_SOURCES="icd10_codes:uc,npi_registry:uc,cms_coverage:uc,pubmed:mcp,clinical_trials:mcp"
command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

env:
  - name: PA_CATALOG
    value: "db_certification"
  - name: PA_SCHEMA
    value: "prior_auth"
  - name: PA_AGENT_MODE
    value: "inprocess"
  - name: PA_STATE_STORE
    value: "lakebase"
  - name: PA_WRITE_DELTA
    value: "false"
  - name: PA_LLM_MODEL
    value: "databricks-claude-sonnet-4-5"
  - name: PA_MCP_MODE
    value: "direct"
  - name: PA_DATA_SOURCES
    value: ""
  - name: PA_USE_PROMPT_REGISTRY
    value: "false"
  - name: PA_REFERENCE_FALLBACK
    value: "false"
  - name: PA_AGENT_TIMEOUT_S
    value: "300"
